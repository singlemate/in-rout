<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d0d0f">

  <title>Маршрутизация Incy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;

      background: #0d0d0f;
      color: #f5f5f7;
    }

    .card {
      width: 100%;
      max-width: 420px;

      padding: 36px 28px;

      background: #18181b;
      border: 1px solid #2a2a2e;
      border-radius: 24px;

      text-align: center;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .icon {
      width: 64px;
      height: 64px;

      margin: 0 auto 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background: #252529;

      font-size: 30px;
    }

    h1 {
      margin: 0 0 12px;

      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .description {
      margin: 0;

      color: #a1a1aa;

      font-size: 16px;
      line-height: 1.5;
    }

    .button {
      display: block;

      margin-top: 28px;
      padding: 16px 20px;

      background: #ffffff;
      color: #111113;

      border-radius: 14px;

      text-decoration: none;

      font-size: 17px;
      font-weight: 650;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .button:active {
      transform: scale(0.97);
      opacity: 0.85;
    }

    .hint {
      margin: 18px 0 0;

      color: #71717a;

      font-size: 13px;
      line-height: 1.4;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="icon">↗</div>

    <h1>Маршрутизация Incy</h1>

    <p class="description">
      Добавьте готовые правила маршрутизации
      Grimbird в приложение Incy.
    </p>

    <a
      class="button"
      href="incy://autorouting/onadd/https://raw.githubusercontent.com/GrimbirdUsers/ru-routing-dat/main/INCY/WHITELIST.JSON">
      Открыть в Incy
    </a>

    <p class="hint">
      Если приложение не открылось автоматически,
      нажмите кнопку выше.
    </p>

  </main>

  <script>
    const incyURL =
      "incy://autorouting/onadd/https://raw.githubusercontent.com/GrimbirdUsers/ru-routing-dat/main/INCY/WHITELIST.JSON";

    setTimeout(() => {
      window.location.href = incyURL;
    }, 700);
  </script>

</body>
</html>
