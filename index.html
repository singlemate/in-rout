<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Настройка маршрутизации Incy</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      max-width: 420px;
      margin: 20px;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-top: 0;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    .button {
      display: block;
      margin-top: 24px;
      padding: 16px 20px;
      border-radius: 12px;
      background: #111;
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 17px;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>Маршрутизация Incy</h1>

  <p>
    Нажмите кнопку ниже, чтобы добавить и включить
    маршрутизацию Grimbird в Incy.
  </p>

  <a
    class="button"
    id="openIncy"
    href="incy://autorouting/onadd/https://raw.githubusercontent.com/GrimbirdUsers/ru-routing-dat/main/INCY/WHITELIST.JSON">
    Открыть в Incy
  </a>

  <p>
    Если Incy не открылся автоматически,
    нажмите кнопку выше.
  </p>
</div>

<script>
  const incyURL =
    "incy://autorouting/onadd/https://raw.githubusercontent.com/GrimbirdUsers/ru-routing-dat/main/INCY/WHITELIST.JSON";

  setTimeout(() => {
    window.location.href = incyURL;
  }, 500);
</script>

</body>
</html>
