<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0b0c">

  <title>Маршрутизация Incy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: #0b0b0c;
      color: #f5f5f7;
    }

    .card {
      width: 100%;
      max-width: 540px;

      padding: 52px 46px 44px;

      background: #18181b;

      border: 1px solid #303034;
      border-radius: 34px;

      text-align: center;

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45);
    }

    .app-icon {
      width: 94px;
      height: 94px;

      display: block;

      margin: 0 auto 32px;

      object-fit: cover;

      border-radius: 24px;

      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 18px;

      font-size: 34px;
      line-height: 1.15;

      font-weight: 750;
      letter-spacing: -0.8px;
    }

    .description {
      max-width: 430px;

      margin: 0 auto;

      color: #aaaab2;

      font-size: 19px;
      line-height: 1.5;
    }

    .button {
      display: flex;

      align-items: center;
      justify-content: center;

      width: 100%;

      margin-top: 38px;
      padding: 19px 24px;

      background: #f5f5f7;
      color: #111113;

      border-radius: 17px;

      text-decoration: none;

      font-size: 20px;
      font-weight: 700;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .button:hover {
      opacity: 0.92;
    }

    .button:active {
      transform: scale(0.98);
      opacity: 0.82;
    }

    .hint {
      margin: 26px auto 0;

      color: #777780;

      font-size: 15px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {

      body {
        padding: 18px;
      }

      .card {
        padding: 40px 24px 34px;
        border-radius: 28px;
      }

      .app-icon {
        width: 82px;
        height: 82px;

        margin-bottom: 28px;

        border-radius: 21px;
      }

      h1 {
        font-size: 29px;
      }

      .description {
        font-size: 17px;
      }

      .button {
        margin-top: 32px;

        padding: 17px 20px;

        font-size: 18px;
      }

      .hint {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <img
      class="app-icon"
      src="incy.png"
      alt="Incy">

    <h1>Маршрутизация Incy</h1>

    <p class="description">
      Добавьте готовые правила маршрутизации
      Grimbird в приложение Incy.
    </p>

    <a
      class="button"
      href="incy://autorouting/onadd/https://raw.githubusercontent.com/GrimbirdUsers/ru-routing-dat/main/INCY/WHITELIST.JSON">
      Открыть в Incy
    </a>

    <p class="hint">
      Если приложение не открылось автоматически,<br>
      нажмите кнопку выше.
    </p>

  </main>

  <script>
    const incyURL =
      "incy://autorouting/onadd/https://raw.githubusercontent.com/GrimbirdUsers/ru-routing-dat/main/INCY/WHITELIST.JSON";

    setTimeout(() => {
      window.location.href = incyURL;
    }, 700);
  </script>

</body>
</html>
